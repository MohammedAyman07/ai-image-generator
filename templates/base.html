<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f6f4">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.svg') }}">
    <title>{% block title %}Ayman Image Generation — Create with AI{% endblock %}</title>
    <meta name="description" content="{% block description %}Create original images from your ideas with Ayman Image Generation.{% endblock %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v='studio-2') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="container nav-container">
            <a href="/" class="brand" aria-label="Ayman Image Generation home">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none">
                        <path d="M12 2.8 14.4 9.6 21.2 12l-6.8 2.4L12 21.2l-2.4-6.8L2.8 12l6.8-2.4L12 2.8Z" fill="currentColor"/>
                        <circle cx="18.5" cy="5.5" r="1.5" fill="currentColor"/>
                    </svg>
                </span>
                <span class="brand-copy"><strong>Ayman</strong><span>Image Generation</span></span>
            </a>
            <div class="nav-right">
                <span class="model-indicator"><span class="status-dot" aria-hidden="true"></span> FLUX.2 Klein 9B</span>
                <nav aria-label="Main navigation">
                    <a href="/" class="{% if request.endpoint == 'index' %}active{% endif %}">Create</a>
                    <a href="/about" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container main-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <a href="/" class="footer-brand"><span class="footer-brand-mark">A</span><span>Ayman Image Generation</span></a>
            <p>Made for ideas worth seeing.</p>
            <div class="footer-links">
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
                <a href="/contact">Contact</a>
            </div>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
